// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '9.2.1' apply false  // Updated for SDK 36
    id 'com.google.gms.google-services' version '4.5.0' apply false  // Updated
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
